# OpenSSL configuration for creating a test certificate
# which can be signed by a certificate authority
#
[ req ]
default_bits        = 512
default_keyfile     = leaf6.key.pem
encrypt_key         = no
default_md          = sha256
distinguished_name  = req_distinguished_name
req_extensions      = req_extensions
prompt              = no

########################################
# Settings for the certificate request #
########################################
[ req_distinguished_name ]
C   = AU
ST  = Victoria
L   = Melbourne
O   = Southern Widgets Corporation
OU  = 21st Century Department
CN  = leaf6
emailAddress  = nobody@southernwidgets.com

# Extensions to place in a leaf certificate.
# Some may be overridden by the CA configuration
[ req_extensions ]
1.3.6.1.4.1.37476.9000.64.4 = ASN1:SEQUENCE:step_managed_device

# Extensions the CA places in the certificate. 'openssl ca' does not copy
# request extensions, so make-certs.sh signs with '-extfile leaf6.cfg'.
[ leaf_extensions ]
basicConstraints        = CA:false
nsComment               = "This is a test certificate only"
subjectKeyIdentifier    = hash
authorityKeyIdentifier  = keyid,issuer
1.3.6.1.4.1.37476.9000.64.4 = ASN1:SEQUENCE:step_managed_device

# Step Managed Device:
# SEQUENCE { deviceID PrintableString, enrolledAt GeneralizedTime OPTIONAL }
[ step_managed_device ]
deviceID   = PRINTABLE:2b2f4e1c-0000-4a1f-9d1e-8a7d2e0f1111
enrolledAt = GENTIME:20261028120000Z
